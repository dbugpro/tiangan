{% set name = "tiangan" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
  entry_points:
    - tiangan = tiangan.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - wheel

  run:
    - python >=3.9
    - dbugtools >=0.1
    - click >=8
    - rich
    - pydantic >=2
    - fastapi
    - uvicorn
    - sqlalchemy
    - jinja2

test:
  imports:
    - tiangan
  commands:
    - tiangan --help
  requires:
    - pytest

about:
  home: https://github.com/dbugpro/tiangan
  license: MIT
  license_file: LICENSE
  summary: Python wrapper around dbugtools with CLI rituals, dashboard, and shared messageboard.
  description: |
    Tiangan wraps the dbugtools ritual glossary for AI/AI, AI/human, and human/human
    group interactions, providing:
      - CLI rituals
      - a dashboard for user settings
      - a shared messageboard backend.

extra:
  recipe-maintainers:
    - dbugpro
