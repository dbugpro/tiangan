{% set name = "tiangan" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  git_url: https://github.com/dbugpro/tiangan.git
  git_tag: v{{ version }}

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv"

requirements:
  host:
    - python >=3.9
    - pip
  run:
    - python >=3.9
    - dbugtools >=0.1.0
    - click  # if your CLI uses click
    - rich   # if you use rich for terminal UI
    - pydantic  # if your settings dashboard uses it
    - requests  # if messageboard interactions use HTTP
    # add/remove based on your actual imports

test:
  imports:
    - tiangan
    - dbugtools
  commands:
    - tiangan --help
  requires:
    - pytest

about:
  home: https://github.com/dbugpro/tiangan
  summary: "Python wrapper for dbugtools providing CLI rituals for AI/AI, AI/human, and human/human group interactions via a shared messageboard and settings dashboard."
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dbugpro

