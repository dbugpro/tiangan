name: Build Conda Package (Docker) and Push Image

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image for Conda build
        run: |
          docker build -f Dockerfile.conda -t dbugpro/tiangan:conda .

      - name: Push Docker image to Docker Hub
        run: |
          docker push dbugpro/tiangan:conda

      - name: Run Conda build inside Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            dbugpro/tiangan:conda \
            conda build recipe --output-folder conda-dist

      - name: Upload Conda package to Anaconda
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -e ANACONDA_API_TOKEN \
            dbugpro/tiangan:conda \
            bash -c "anaconda upload conda-dist/**/tiangan-*.tar.bz2 --label main"
